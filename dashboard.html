<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard ESP32</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
}

h1 {
    margin: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin: 10px auto;
    width: 300px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.online {
    color: #22c55e;
}

.offline {
    color: #ef4444;
}

.time {
    font-size: 12px;
    color: #94a3b8;
}
</style>

</head>
<body>

<h1>📡 Dashboard ESP32</h1>

<div id="container"></div>

<script>

const API = "https://esp32-api-l4fo.onrender.com/logs/";

function carregar() {
    fetch(API)
        .then(res => res.json())
        .then(data => {

            let container = document.getElementById("container");
            container.innerHTML = "";

            let devices = {};

            data.forEach(item => {
                devices[item.device_id] = item;
            });

            for (let id in devices) {
                let item = devices[id];

                let agora = new Date();
                let ultimo = new Date(item.created_at);
                let diff = (agora - ultimo) / 1000;

                let status = diff < 60 ? "online" : "offline";

                let html = `
                    <div class="card">
                        <h2>${id}</h2>
                        <p class="${status}">
                            ${status.toUpperCase()}
                        </p>
                        <p class="time">
                            Último sinal: ${item.created_at}
                        </p>
                    </div>
                `;

                container.innerHTML += html;
            }
        });
}

// atualiza a cada 3s
setInterval(carregar, 3000);
carregar();

</script>

</body>
</html>
